<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" role="img" aria-labelledby="t d">
  <title id="t">Employee attrition prediction</title>
  <desc id="d">Flat illustration: a laptop shows the model's top attrition drivers while employees in an office are scored, with two flagged as at risk and one walking to the exit.</desc>
  <defs>
    <style>
      .navy { fill: #1f3b57; }
      .txt { font-family: Poppins, Arial, Helvetica, sans-serif; fill: #1f3b57; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <rect width="880" height="640" fill="#ffffff"/>

  <!-- clouds -->
  <g fill="#e3f3f7">
    <rect x="470" y="96" width="70" height="16" rx="8"/>
    <rect x="495" y="84" width="40" height="18" rx="9"/>
    <rect x="720" y="122" width="78" height="16" rx="8"/>
    <rect x="744" y="110" width="40" height="18" rx="9"/>
  </g>

  <!-- office backdrop -->
  <rect x="400" y="170" width="470" height="300" fill="#e3f3f7"/>
  <g fill="#d3ecf2">
    <rect x="420" y="192" width="92" height="120" rx="4"/>
    <rect x="528" y="192" width="92" height="120" rx="4"/>
    <rect x="636" y="192" width="92" height="120" rx="4"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.6">
    <rect x="430" y="202" width="72" height="4"/><rect x="538" y="202" width="72" height="4"/><rect x="646" y="202" width="72" height="4"/>
  </g>

  <!-- floor -->
  <rect x="380" y="470" width="500" height="56" fill="#f3e9d2"/>
  <rect x="380" y="494" width="500" height="6" fill="#e6d7b5"/>

  <!-- plant -->
  <rect x="404" y="438" width="26" height="32" rx="4" fill="#f5b041"/>
  <circle cx="417" cy="424" r="16" fill="#7cc7b5"/>
  <circle cx="405" cy="432" r="10" fill="#5aa594"/>

  <!-- exit door -->
  <rect x="790" y="292" width="68" height="178" rx="4" fill="#1abc9c" stroke="#1f3b57" stroke-width="5"/>
  <circle cx="846" cy="384" r="5" fill="#1f3b57"/>
  <rect x="796" y="262" width="56" height="22" rx="4" fill="#f5b041"/>
  <text class="txt bold" x="824" y="278" font-size="13" text-anchor="middle" letter-spacing="1">EXIT</text>

  <!-- employees: head, body -->
  <!-- 1: staying -->
  <circle cx="468" cy="336" r="17" fill="#8d5524"/>
  <rect x="444" y="358" width="48" height="112" rx="24" fill="#1f3b57"/>
  <!-- 2: staying -->
  <circle cx="540" cy="336" r="17" fill="#e0ac69"/>
  <rect x="516" y="358" width="48" height="112" rx="24" fill="#1abc9c"/>
  <!-- 3: at risk -->
  <circle cx="612" cy="336" r="17" fill="#c68642"/>
  <rect x="588" y="358" width="48" height="112" rx="24" fill="#1f3b57"/>
  <!-- 4: staying -->
  <circle cx="684" cy="336" r="17" fill="#f2a072"/>
  <rect x="660" y="358" width="48" height="112" rx="24" fill="#1abc9c"/>
  <!-- 5: leaving, walking toward exit -->
  <circle cx="752" cy="346" r="16" fill="#8d5524"/>
  <path d="M732 368 q20 -8 40 0 l6 70 l-10 32 h-10 l-6 -28 l-6 28 h-10 l-8 -34 z" fill="#1f3b57"/>
  <rect x="770" y="392" width="16" height="22" rx="3" fill="#f5b041"/>
  <path d="M700 300 h40" fill="none" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/>
  <path d="M732 292 l10 8 l-10 8" fill="none" stroke="#1f3b57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- risk flags -->
  <rect x="578" y="312" width="68" height="166" rx="8" fill="none" stroke="#f5b041" stroke-width="4" stroke-dasharray="10 6"/>
  <rect x="574" y="282" width="76" height="26" rx="6" fill="#f5b041"/>
  <text class="txt bold" x="612" y="300" font-size="13" text-anchor="middle">At risk</text>

  <rect x="722" y="322" width="70" height="156" rx="8" fill="none" stroke="#f5b041" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- laptop -->
  <rect x="56" y="168" width="310" height="214" rx="14" fill="#ffffff" stroke="#1f3b57" stroke-width="9"/>
  <rect x="72" y="184" width="278" height="182" rx="6" fill="#f4fafb"/>
  <path d="M26 388 L396 388 L376 410 L46 410 Z" fill="#1f3b57"/>
  <rect x="176" y="392" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>

  <!-- dashboard: top attrition drivers -->
  <text class="txt bold" x="88" y="214" font-size="15">Top attrition drivers</text>
  <text class="txt" x="88" y="248" font-size="12">Projects</text>
  <text class="txt" x="88" y="280" font-size="12">Satisfaction</text>
  <text class="txt" x="88" y="312" font-size="12">Tenure</text>
  <text class="txt" x="88" y="344" font-size="12">Evaluation</text>
  <rect x="178" y="237" width="156" height="14" rx="7" fill="#f5b041"/>
  <rect x="178" y="269" width="144" height="14" rx="7" fill="#f5b041"/>
  <rect x="178" y="301" width="112" height="14" rx="7" fill="#1abc9c"/>
  <rect x="178" y="333" width="46" height="14" rx="7" fill="#7cc7b5"/>

  <!-- model badge -->
  <rect x="86" y="436" width="250" height="38" rx="19" fill="#1abc9c"/>
  <text x="211" y="461" text-anchor="middle" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#ffffff">XGBoost · recall 0.93</text>

  <!-- title -->
  <text class="txt bold" x="846" y="596" text-anchor="end" font-size="28" letter-spacing="2">EMPLOYEE ATTRITION PREDICTION</text>
</svg>
