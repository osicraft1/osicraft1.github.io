<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" role="img" aria-labelledby="t d">
  <title id="t">Utility pole detection</title>
  <desc id="d">Flat illustration: a phone scans a street-view scene and a deep-learning model draws labelled boxes around utility poles.</desc>
  <defs>
    <style>
      .navy { fill: #1f3b57; }
      .wire { fill: none; stroke: #1f3b57; stroke-width: 2.5; stroke-opacity: 0.55; }
      .label { font-family: Poppins, Arial, Helvetica, sans-serif; font-weight: 700; fill: #1f3b57; }
    </style>
  </defs>

  <rect width="880" height="640" fill="#ffffff"/>

  <!-- clouds -->
  <g fill="#e3f3f7">
    <rect x="430" y="92" width="70" height="16" rx="8"/>
    <rect x="455" y="80" width="40" height="18" rx="9"/>
    <rect x="690" y="120" width="80" height="16" rx="8"/>
    <rect x="715" y="108" width="40" height="18" rx="9"/>
    <rect x="330" y="150" width="56" height="14" rx="7"/>
  </g>

  <!-- city skyline -->
  <g fill="#d3ecf2">
    <rect x="300" y="300" width="70" height="170"/>
    <rect x="380" y="250" width="56" height="220"/>
    <rect x="446" y="320" width="64" height="150"/>
    <rect x="640" y="270" width="60" height="200"/>
    <rect x="800" y="300" width="60" height="170"/>
  </g>
  <g fill="#c2e3eb">
    <rect x="340" y="340" width="50" height="130"/>
    <rect x="600" y="330" width="48" height="140"/>
    <rect x="690" y="350" width="70" height="120"/>
    <rect x="830" y="360" width="40" height="110"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.7">
    <rect x="392" y="270" width="10" height="14"/><rect x="414" y="270" width="10" height="14"/>
    <rect x="392" y="298" width="10" height="14"/><rect x="414" y="298" width="10" height="14"/>
    <rect x="392" y="326" width="10" height="14"/><rect x="414" y="326" width="10" height="14"/>
    <rect x="652" y="290" width="10" height="14"/><rect x="676" y="290" width="10" height="14"/>
    <rect x="652" y="318" width="10" height="14"/><rect x="676" y="318" width="10" height="14"/>
  </g>

  <!-- ground and road -->
  <rect x="290" y="470" width="590" height="56" fill="#f3e9d2"/>
  <rect x="290" y="494" width="590" height="6" fill="#e6d7b5"/>

  <!-- trees -->
  <g fill="#7cc7b5">
    <circle cx="318" cy="452" r="16"/><circle cx="604" cy="456" r="13"/><circle cx="852" cy="454" r="15"/>
  </g>
  <g fill="#5aa594">
    <rect x="316" y="460" width="4" height="12"/><rect x="602" y="462" width="4" height="10"/><rect x="850" y="461" width="4" height="11"/>
  </g>

  <!-- wires (behind poles) -->
  <path class="wire" d="M362 342 Q 460 300 494 200"/>
  <path class="wire" d="M362 342 Q 470 320 626 200"/>
  <path class="wire" d="M626 200 Q 690 250 790 306"/>
  <path class="wire" d="M494 200 Q 640 260 728 306"/>
  <path class="wire" d="M612 240 Q 700 280 790 318"/>

  <!-- far pole -->
  <rect class="navy" x="358" y="332" width="8" height="138"/>
  <rect class="navy" x="338" y="340" width="48" height="5"/>

  <!-- main pole -->
  <rect class="navy" x="552" y="172" width="16" height="298"/>
  <rect class="navy" x="490" y="196" width="140" height="10" rx="2"/>
  <rect class="navy" x="506" y="236" width="108" height="9" rx="2"/>
  <g fill="#f5b041">
    <rect x="498" y="184" width="8" height="12" rx="2"/><rect x="530" y="184" width="8" height="12" rx="2"/>
    <rect x="582" y="184" width="8" height="12" rx="2"/><rect x="614" y="184" width="8" height="12" rx="2"/>
    <rect x="514" y="225" width="7" height="11" rx="2"/><rect x="600" y="225" width="7" height="11" rx="2"/>
  </g>

  <!-- second pole -->
  <rect class="navy" x="756" y="296" width="10" height="174"/>
  <rect class="navy" x="726" y="304" width="70" height="7" rx="2"/>
  <rect class="navy" x="736" y="320" width="50" height="6" rx="2"/>

  <!-- detection boxes -->
  <rect x="476" y="150" width="170" height="332" rx="6" fill="none" stroke="#f5b041" stroke-width="5"/>
  <rect x="476" y="116" width="168" height="34" rx="6" fill="#f5b041"/>
  <text class="label" x="490" y="139" font-size="17">Utility pole 0.91</text>

  <rect x="712" y="282" width="98" height="196" rx="6" fill="none" stroke="#f5b041" stroke-width="4"/>
  <rect x="712" y="254" width="132" height="28" rx="6" fill="#f5b041"/>
  <text class="label" x="722" y="273" font-size="14">Utility pole 0.75</text>

  <!-- hand -->
  <path d="M40 640 L40 470 Q40 430 78 424 L104 420 L104 640 Z" fill="#f2a072"/>
  <path d="M232 520 Q300 512 300 470 Q300 446 270 448 L232 452 Z" fill="#f2a072"/>

  <!-- phone -->
  <rect x="66" y="140" width="220" height="380" rx="28" fill="#ffffff" stroke="#1f3b57" stroke-width="9"/>
  <rect x="146" y="156" width="60" height="7" rx="3.5" fill="#1f3b57" fill-opacity="0.25"/>

  <!-- phone screen: mini street view -->
  <rect x="88" y="182" width="176" height="238" rx="10" fill="#e3f3f7"/>
  <rect x="88" y="372" width="176" height="48" fill="#f3e9d2"/>
  <rect x="104" y="300" width="34" height="72" fill="#c2e3eb"/>
  <rect x="216" y="290" width="36" height="82" fill="#c2e3eb"/>
  <rect class="navy" x="171" y="236" width="9" height="136"/>
  <rect class="navy" x="140" y="248" width="71" height="6" rx="2"/>
  <rect class="navy" x="150" y="270" width="51" height="5" rx="2"/>
  <rect x="126" y="222" width="100" height="160" rx="5" fill="none" stroke="#1abc9c" stroke-width="4"/>
  <rect x="126" y="204" width="68" height="18" rx="4" fill="#1abc9c"/>
  <text x="132" y="217" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#ffffff">pole 0.91</text>

  <!-- location pin -->
  <path d="M232 196 c-11 0 -18 8 -18 17 c0 13 18 29 18 29 s18 -16 18 -29 c0 -9 -7 -17 -18 -17 z" fill="#f5b041"/>
  <circle cx="232" cy="213" r="6" fill="#ffffff"/>

  <!-- detect button -->
  <rect x="110" y="438" width="132" height="40" rx="10" fill="#1abc9c"/>
  <text x="176" y="464" text-anchor="middle" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#ffffff" letter-spacing="1">DETECT</text>

  <!-- title -->
  <text class="label" x="846" y="596" text-anchor="end" font-size="30" letter-spacing="2">UTILITY POLE DETECTION</text>
</svg>
